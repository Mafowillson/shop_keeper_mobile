name: shopkeeper
description: ShopKeeper - Mobile Shop Management System with Clean Architecture
publish_to: 'none'

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  go_router: ^14.2.0
  google_fonts: ^6.2.1
  intl: ^0.19.0
  flutter_animate: ^4.5.0
  material_symbols_icons: ^4.2719.1
  shared_preferences: ^2.3.2
  fpdart: ^1.1.0
  get_it: ^8.0.0
  injectable: ^2.4.2
  dio: ^5.9.2
  flutter_secure_storage: ^9.2.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.1.4
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  injectable_generator: ^2.6.1

flutter:
  uses-material-design: true
  assets:
    - assets/
